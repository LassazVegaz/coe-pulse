name: Deploy backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test app/backend/COEPulse.API.Tests/COEPulse.API.Tests.csproj

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - name: Initialize Terraform
        working-directory: terraform
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=coe-pulse/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Create container repository
        working-directory: terraform
        env:
          TF_VAR_data_gov_api_key: ${{ secrets.DATA_GOV_API_KEY }}
        run: terraform apply -auto-approve -target=aws_ecr_repository.api

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REPOSITORY=$(terraform -chdir=terraform output -raw ecr_repository_url)
          docker build --tag "$ECR_REPOSITORY:$IMAGE_TAG" app/backend
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy infrastructure
        working-directory: terraform
        env:
          TF_VAR_data_gov_api_key: ${{ secrets.DATA_GOV_API_KEY }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
